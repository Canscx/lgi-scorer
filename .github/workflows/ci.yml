name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 校验 · Linux (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        shell: bash
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fontconfig

      - name: 规则包配置校验
        run: node scripts/validate-config.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 报告字体自检
        run: pnpm check:font

      - name: 构建前端
        run: pnpm build

  validate-windows:
    name: 校验 · Windows (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 安装依赖
        shell: bash
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: 规则包配置校验
        run: node scripts/validate-config.mjs

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 报告字体自检
        run: pnpm check:font

      - name: 构建前端
        run: pnpm build