name: 功能建议
description: 提出新功能或改进想法（新增能力、交互优化、报告样式、部署体验等）
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        建议前请先搜一下已有 issue，避免重复提。想清楚"谁在什么场景下需要它"，比"加个按钮"更容易被采纳。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与要解决的问题
      description: 现在遇到什么麻烦？现在是怎么绕过去的？
      placeholder: 客户每次都要自己数Ⅰ类专利数量，容易漏，希望系统直接算出来。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望怎么用
      description: 描述理想的使用方式，尽量给一个具体场景或界面草图描述。
      placeholder: 在门槛表里直接显示"Ⅰ类知识产权 3 项（不含转入）"，并标出还差几项。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅前端
        - 仅后端
        - 前后端都涉及
        - 规则包或配置（config/rules、config/catalog）
        - 部署脚本或文档
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过但没选的做法，以及不选的原因（可选）。
  - type: dropdown
    id: gate
    attributes:
      label: 是否会改变门槛判定口径
      description: 门槛与分数是分离的，改口径会影响所有用户的结论，请如实选。
      options:
        - 不会，只改展示或交互
        - 会，需要改 config/rules/ 里的参数
        - 会，需要改引擎实现
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: policy
    attributes:
      label: 口径与约束确认
      options:
        - label: 我已读过 README 的「它不做什么」与「免责声明」，本建议不改变本工具作为自查参考、非官方评分的定位
          required: true
        - label: 我理解门槛与分数分离：硬门槛不过，分数再高也不通过
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复的同类建议
          required: true
