# 宝塔「Node 项目」反向代理配置 —— 替换 location / 那一段
#
# 用法：在 站点/项目 → 配置文件 里找到
#        # HTTP反向代理相关配置开始 >>>
#            ...
#            location / {
#                proxy_pass http://127.0.0.1:8788;
#                ...
#            }
#        # HTTP反向代理相关配置结束 <<<
#      只替换 location / { ... } 这一整块（含大括号），把下面的内容贴进去。
#      同一区块里如果有 location ~ /purge(...)，保留不要动。
#
# 老版本宝塔网站配置的标记是 #PROXY-START/ 到 #PROXY-END/，同样只替换 location / 这一块。
#
# 改完执行: nginx -t && nginx -s reload
# 不要再用面板的「反向代理」「加密访问」按钮，会覆盖本段

# ① SSE 专用：解析进度实时推送，必须先于 location / 匹配
location ~ ^/api/jobs/[^/]+/stream$ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
}

# ② 其余请求
location / {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 60m;
}
