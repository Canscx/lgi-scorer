<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:26px;background:#eef1f6;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif}
h1{font-size:16px;margin:0 0 4px;color:#0f172a}
p{margin:0 0 20px;font-size:12px;color:#64748b}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.col{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;box-shadow:0 12px 30px -26px rgba(15,23,42,.7)}
.hd{padding:10px 14px;font-size:12.5px;font-weight:600;color:#0f172a;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;align-items:baseline}
.hd em{font-style:normal;font-weight:400;font-size:11px;color:#94a3b8}
img{display:block;width:100%;height:auto}
</style></head><body>
<h1>专精特新 · 小巨人自评系统 · 视觉方案对比</h1>
<p>本轮重点：方案 E（Bento Grid 卡片风）、方案 F（现代极简风）。方案 C/D 为上一轮的深色系备选。</p>
<div class="row">
  <div class="col"><div class="hd">方案 E · Bento Grid 卡片风<em>浅紫渐变 + 大圆角卡片</em></div><img src="style-e.png"></div>
  <div class="col"><div class="hd">方案 F · 现代极简风 Minimalism<em>白底黑字 + 大留白</em></div><img src="style-f.png"></div>
  <div class="col"><div class="hd">方案 C · 黑金<em>上一轮备选</em></div><img src="style-c.png"></div>
  <div class="col"><div class="hd">方案 D · 黑金 Bento<em>上一轮备选</em></div><img src="style-d.png"></div>
</div>
</body></html>
